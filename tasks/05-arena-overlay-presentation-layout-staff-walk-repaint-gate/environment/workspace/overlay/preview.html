<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Tui — browser preview</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #dcf5e0;
        --frame: #ffffff;
        --line: #c3ecc9;
        --ink: #0b3d1f;
        --muted: #4a8a5e;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px 40px;
        gap: 16px;
      }
      .hint {
        max-width: 720px;
        text-align: center;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.45;
      }
      .hint code {
        font-family: var(--mono);
        font-size: 16px;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 2px 6px;
        box-shadow: 0 1px 2px rgba(22, 101, 52, 0.08);
      }
      .stage {
        width: var(--preview-width, 520px);
        height: var(--preview-height, 740px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 16px;
        overflow: hidden;
        background: var(--frame);
        box-shadow:
          0 24px 60px rgba(22, 101, 52, 0.2),
          0 8px 24px rgba(22, 101, 52, 0.1);
        transition: width 160ms ease, height 160ms ease;
      }
      .stage iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #eafbee;
      }
      .stage.scene-preview { height: var(--preview-height, 300px); border: 0; }
      .meta {
        font-family: var(--mono);
        font-size: 16px;
        color: var(--muted);
      }
      /* Restaurant Arena owns the whole window instead of sitting inside a
         Tauri-window mockup — the browser tab IS the game, so nothing here
         should compete with it for pixels. */
      body.fill-stage {
        display: block;
        padding: 0;
        gap: 0;
      }
      body.fill-stage .hint,
      body.fill-stage .meta {
        display: none;
      }
      .stage.fill {
        width: 100vw;
        height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        transition: none;
      }
    </style>
  </head>
  <body>
    <p class="hint">
      Browser preview of the Tui overlay (same compact/expanded sizes as Tauri:
      600×850 compact). Titlebar <strong>↗</strong> toggles the frame. Deep-link with
      <code>?game=restaurant-arena</code>.
    </p>
    <div class="stage" id="stage" aria-label="Overlay preview frame">
      <iframe id="overlay" title="Tui overlay"></iframe>
    </div>
    <p class="meta" id="size-label">600 × 850</p>
    <script>
      const COMPACT = { width: 600, height: 850 };
      const stage = document.getElementById("stage");
      const frame = document.getElementById("overlay");
      const label = document.getElementById("size-label");
      let fillStage = false;

      function applySize(width, height) {
        if (fillStage) return;
        stage.style.setProperty("--preview-width", width + "px");
        stage.style.setProperty("--preview-height", height + "px");
        label.textContent = width + " × " + height;
      }

      const params = new URLSearchParams(location.search);
      if (params.get("scene") === "restaurant-arena") {
        document.querySelector(".hint").innerHTML = "Restaurant Arena scene · resize the browser to test its responsive floor plan.";
        stage.classList.add("scene-preview");
        frame.srcdoc = `<!doctype html><html><head><style>*{box-sizing:border-box}html,body,#restaurant-arena{margin:0;width:100%;height:100%;overflow:hidden;background:#2b2118}</style></head><body><div id="restaurant-arena"></div><script type="module" src="/restaurant-arena-preview.js"><\/script></body></html>`;
        const applySceneSize = () => {
          const width = Math.max(320, Math.min(520, innerWidth - 32));
          applySize(width, Math.max(200, Math.round(width * 300 / 520)));
        };
        applySceneSize();
        window.addEventListener("resize", applySceneSize);
      } else {
      const appParams = new URLSearchParams();
      if (params.get("game")) appParams.set("game", params.get("game"));
      if (params.get("variation")) appParams.set("variation", params.get("variation"));
      if (params.get("scores")) appParams.set("scores", params.get("scores"));
      if (params.get("update")) appParams.set("update", params.get("update"));
      const query = appParams.toString();
      frame.src = "/index.html" + (query ? "?" + query : "");

      applySize(COMPACT.width, COMPACT.height);
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || data.type !== "gamepigeon:preview-resize") return;
        const width = Number(data.width);
        const height = Number(data.height);
        if (!Number.isFinite(width) || !Number.isFinite(height)) return;
        applySize(width, height);
      });
    </script>
  </body>
</html>
